name: Plantractor CI Pipeline

on:
  push:
    branches: [ "main", "docker" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # UNIT TESTS

      - name: Install Dependencies (Unit)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Instala dependências dos módulos para os testes unitários funcionarem
          pip install -r web/requirements.txt
          pip install -r database/requirements.txt

      - name: Run Unit Tests (7 tests)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/unit -v

      # INTEGRATION TESTS
      - name: Start Containers
        run: docker compose up -d --build

      - name: Wait for Servers
        run: sleep 15

      - name: Install Test Dependencies (Integration)
        run: pip install requests

      - name: Run Integration Tests (3 tests)
        run: pytest tests/integration -v

      - name: Stop Containers
        if: always()
        run: docker compose down