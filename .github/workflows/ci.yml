name: Plantractor CI Pipeline

on:
  push:
    branches: [ "main", "docker" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- ETAPA 1: TESTES UNITÁRIOS (Rápido, sem Docker) ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies (Unit)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Instala dependências dos módulos para os testes unitários funcionarem
          pip install -r web/requirements.txt
          pip install -r database/requirements.txt

      - name: Run Unit Tests (7 tests)
        # Adiciona pastas ao PYTHONPATH para imports funcionarem (ex: from web.verifiers import ...)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/unit -v

      # --- ETAPA 2: TESTES DE INTEGRAÇÃO (Com Docker) ---
      - name: Start Containers
        run: docker compose up -d --build

      - name: Wait for Services Healthy
        run: sleep 15  # Espera simples para garantir que Nginx e Flask subiram

      - name: Install Test Dependencies (Integration)
        run: pip install requests  # Geralmente necessário para testar APIs externamente

      - name: Run Integration Tests (3 tests)
        # Os testes devem bater em http://localhost:80 (Web via Proxy) ou http://localhost:5001 (DB)
        run: pytest tests/integration -v

      - name: Stop Containers
        if: always()
        run: docker compose down